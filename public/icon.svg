<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1b16"/>
      <stop offset="1" stop-color="#3b2f22"/>
    </linearGradient>
    <!-- Upper arc the letters follow, left to right -->
    <path id="arc" d="M 104 262 A 152 152 0 0 1 408 262"/>
    <clipPath id="globe"><circle cx="256" cy="318" r="104"/></clipPath>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#e0a868" stroke-width="4" opacity=".55"/>

  <!-- PYT along the top of the circle -->
  <text font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="102" font-weight="600" fill="#f4efe5" letter-spacing="18">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">PYT</textPath>
  </text>

  <!-- Globe -->
  <circle cx="256" cy="318" r="104" fill="#2a241c" stroke="#f4efe5" stroke-width="7"/>
  <g clip-path="url(#globe)" fill="none" stroke="#f4efe5" stroke-width="4" opacity=".55">
    <ellipse cx="256" cy="318" rx="44" ry="104"/>
    <ellipse cx="256" cy="318" rx="82" ry="104"/>
    <line x1="256" y1="210" x2="256" y2="426"/>
    <path d="M 148 318 H 364"/>
    <path d="M 160 268 Q 256 252 352 268"/>
    <path d="M 160 368 Q 256 384 352 368"/>
  </g>

  <!-- Flight path wrapping the globe, with a plane -->
  <path d="M 118 404 C 150 470 330 476 392 392 C 428 344 420 268 384 236" fill="none" stroke="#e0a868" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16"/>
  <g transform="translate(384 230) rotate(-118)">
    <path d="M 0 -26 C 5 -26 7 -20 7 -12 L 7 -4 L 30 10 L 30 17 L 7 9 L 7 22 L 15 29 L 15 34 L 0 30 L -15 34 L -15 29 L -7 22 L -7 9 L -30 17 L -30 10 L -7 -4 L -7 -12 C -7 -20 -5 -26 0 -26 Z" fill="#e0a868"/>
  </g>

  <!-- Destination pin on the globe -->
  <g transform="translate(232 290)">
    <path d="M 0 34 C -18 12 -22 2 -22 -6 A 22 22 0 0 1 22 -6 C 22 2 18 12 0 34 Z" fill="#e0a868" stroke="#2a241c" stroke-width="4"/>
    <circle cx="0" cy="-6" r="8" fill="#2a241c"/>
  </g>
</svg>
